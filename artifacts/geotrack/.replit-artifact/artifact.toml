kind = "web"
previewPath = "/"
title = "GeoTrack224 Intelligence"
version = "1.0.0"
id = "artifacts/geotrack"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20895

[services.development]
run = "pnpm --filter @workspace/geotrack run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/geotrack", "run", "build" ]
publicDir = "artifacts/geotrack/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20895"
BASE_PATH = "/"

name: Apply branch protection

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/branch-protection.yml'

jobs:
  protect:
    name: Enforce main branch protection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      administration: write

    steps:
      - name: Apply branch protection rules
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.updateBranchProtection({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
              required_status_checks: {
                strict: true,
                checks: [
                  { context: 'Sync check' }
                ]
              },
              enforce_admins: false,
              required_pull_request_reviews: {
                required_approving_review_count: 1,
                dismiss_stale_reviews: true,
                require_code_owner_reviews: false,
                require_last_push_approval: false
              },
              restrictions: null,
              allow_force_pushes: false,
              allow_deletions: false
            });
            console.log('Branch protection applied to main');
            console.log('  - Required status check : Sync check (sync.yml)');
            console.log('  - Required PR reviews   : 1 approving review');
            console.log('  - Dismiss stale reviews : true');
            console.log('  - Force pushes          : blocked');
            console.log('  - Branch deletions      : blocked');
